# Fresh S1 on stair channels only (47–49). Isolated results/xfer/discrete_s1/.
# Does not touch results/shell_s* or the six-channel extra-M1 score.
phase: s0
seed: 0
allow_test_telemetry: false

causaldiscovery_root: /mnt/extras/SSD/AI/CausalDiscovery
data_root: data/ESA-Mission1
bin_seconds: 30
panel_npz: /mnt/extras/SSD/AI/AnoGen/results/xfer/discrete_s1/panel.npz

splits:
  path_train_end: "2006-10-01"
  official_train_end: "2007-01-01"

channels:
  - channel_47
  - channel_48
  - channel_49

output_dir: results/xfer/discrete_s1/s0
s0_dir: results/xfer/discrete_s1/s0
s1_dir: results/xfer/discrete_s1/s1
plots_dir: results/xfer/discrete_s1/plots

shell:
  W: 512
  N_generate: 128
  n_folds: 3
  n_nominal_per_channel: 2048
  max_crops_per_event: 8
  guard_bins: 16
  min_anomaly_windows: 3
  min_fs_windows: 8
  train_includes_rares: true
  rare_upsample: 1
  tau:
    unguided_target: 0.10
  win:
    occupancy_min: 0.8
    diversity_ratio_min: 0.5
    must_beat: [genias, posthoc]
  scaler:
    kind: minmax
    feature_range: [0.0, 1.0]
  diffusion:
    backbone: tsdiff
    hidden: 64
    n_layers: 6
    d_state: 64
    n_times: 200
    steps: 20000
    batch_size: 128
    lr: 2.0e-4
    val_frac: 0.1
    ddim_steps: 20
    unguided_nu: 1.0
    n_sample: 256
