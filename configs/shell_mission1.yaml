# Steered diffusion + GenIAS and post-hoc references. No SCM or PCMCI+.
phase: s0
seed: 0
output_dir: results/shell_s0
allow_test_telemetry: false

causaldiscovery_root: /mnt/extras/SSD/AI/CausalDiscovery
panel_npz: results/mission1/panel_light.npz
data_root: data/ESA-Mission1
bin_seconds: 30

splits:
  path_train_end: "2006-10-01"
  official_train_end: "2007-01-01"

channels:
  - channel_41
  - channel_42
  - channel_43
  - channel_44
  - channel_45
  - channel_46

shell:
  W: 512
  N_generate: 256
  n_folds: 3
  n_nominal_per_channel: 4096
  max_crops_per_event: 8
  guard_bins: 16
  min_anomaly_windows: 5
  min_fs_windows: 8
  train_includes_rares: true
  rare_upsample: 1
  tau:
    unguided_target: 0.10
  win:
    occupancy_min: 0.8
    diversity_ratio_min: 0.5
    must_beat: [genias, posthoc]
  scaler:
    kind: minmax
    feature_range: [0.0, 1.0]
  diffusion:
    backbone: tsdiff
    hidden: 64
    n_layers: 6
    d_state: 64
    n_times: 200
    steps: 20000
    batch_size: 128
    lr: 2.0e-4
    val_frac: 0.1
    ddim_steps: 20
    unguided_nu: 1.0
    n_sample: 256
    # false = frozen causal S4-D (every layer sees only x_t[0..i]).
    # `anogen s1bidir` trains the bidirectional variant into results/shell_s1_bidir.
    bidirectional: false
  # `anogen s1v2` (bidirectional + log-spaced schedule, results/shell_s1_v2).
  # Pick sigma_min / sigma_max with
  #   scripts/schedule_check.py -c configs/shell_mission1.yaml --standardize
  # (95 % texture kept, terminal SNR <= 1 % on every channel). scaler_v2 is used
  # by S1 only and stored in its checkpoint; S0 is untouched, and fixsweep /
  # diffdetect keep the frozen edit's physical noise level (scaler.unit_scale).
  # diffusion_v2: {sigma_min: 1.0e-3, sigma_max: 10.0, ema_decay: 0.999}
  #   (add parameterization: v only if from-noise samples keep a level bias; no gain in testbed E16)
  # scaler_v2: {kind: standard}        # per-channel z-score; or {feature_range: [-1.0, 1.0]}
  steer:
    enc_hidden: 32
    emb: 32
    enc_steps: 400
    enc_lr: 1.0e-3
    n_ref: 512
    q: 0.99
    delta_scale: 0.25
    nu: 0.2
    lambda: 0.3
    c_max: 1.0
    n_sample: 128
  tune:
    n_cond: 192
    n_ref_label: 256
    bsz: 64
    regen_n: 512
  kindproto:
    n: 128
    ddim_steps_long: 200
  kindmix:
    n: 256
  kindmix_htune:
    n: 128
  enc_ablation:
    time_emb: 8
    steps_recon: 800
    steps_supcon: 1200
    batch_size: 64
    per_class: 32
    temperature: 0.1
    n_steer: 192

  genias:
    hidden: 48
    latent: 16
    steps: 15000
    batch_size: 128
    psi: 2.0
    psi_extra: [1.0, 1.5]
    patch_tau: 0.2
  # docs/POSITION_BIAS.md. Isolated results/shell_fixsweep; does not touch any freeze.
  fixsweep:
    encoder: time_both
    recipe: hybrid_needles
    folds: [0, 1, 2]
    burnin_bins: 256
    n_boot: 1000
    baseline: c1_repro
    # variants: omit to use DEFAULT_VARIANTS in phases/fixsweep.py. Example of
    # adding the bidirectional backbone once `anogen s1bidir` has run:
    # variants:
    #   c1_repro: {}
    #   bidir_x0: {denoiser: results/shell_s1_bidir/denoiser.pt, guidance_space: x0,
    #              final_grad_scale: 0.25, burnin: true, context: both}
    #   v2_x0:    {denoiser: results/shell_s1_v2/denoiser.pt, guidance_space: x0,
    #              final_grad_scale: 0.25, burnin: true, context: both}
  # Label-free detection with the nominal diffusion score. results/shell_diffdetect.
  diffdetect:
    t_eval: [10, 20, 40]
    n_draws: 4
    target_far: 0.01
  # augdetect (dev only). donor_disjoint fixes the train/test donor overlap
  # (REVIEW_2026-10-03 §2.6); set false only to reproduce docs/AUGDETECT.md.
  augdetect:
    donor_disjoint: true
    flip_test: true
    shift_aug: 0
    # fuse_diffscore: results/shell_diffdetect/flip_ramp_top16_multiscale_scores.npz
    # Detector-utility test of the position-bias fixes (docs/POSITION_BIAS.md,
    # "Primary endpoint"). Needs `anogen fixsweep` first. "+real" adds the
    # synthetic positives to the real training anomalies; every fixsweep arm is
    # paired with its no-steer twin automatically when both are listed.
    # arms: [real_only, "genias+real", "posthoc+real", "unguided+real", c1_plus_real,
    #        "fixsweep:flip_x0_contrast_masked+real", "fixsweep:flip_x0_contrast_masked_div+real",
    #        "fixsweep:nosteer_flip_x0_masked+real",
    #        "fixsweep:flip_x0_final025_recur2_decay1+real", "fixsweep:nosteer_flip_x0_recur2+real"]
    #   after `anogen geniasfair` also "geniasfair:genias_fair+real" (published GenIAS objective)
    # compare:
    #   - ["fixsweep:flip_x0_contrast_masked_div+real", "genias+real"]
    #   - ["fixsweep:flip_x0_contrast_masked_div+real", c1_plus_real]
    #   - ["fixsweep:flip_x0_contrast_masked_div+real", "fixsweep:flip_x0_contrast_masked+real"]
    # Optional, both off by default (docs/TESTBED.md E20):
    # synth_filter: {kind: rocket_knn, q: 0.99}  # drop generated windows inside the nominal set;
    #   rescues near-nominal galleries (twin +15 points, unguided +3 in E20), neutral for the
    #   recipe, costs subtle real-like positives (perfect ones −7); report its pass rate
    #   (summary.json synth_pass_rate_mean) either way
    # real_frac: 0.5   # share of real anomalies per positive batch (no effect with BCE in E20)
  # Published GenIAS objective (P6). Isolated results/shell_genias_fair.
  genias_fair:
    steps: 15000
    latent: 16
    beta: 0.1
    zeta: 0.1
    sigma_prior: 0.5
    delta_min: 0.1
    delta_max: 0.2
    psi_init: 2.0
    tau_raw: [0.01, 0.1, 1.0]
    tau_whitened: [1.0, 10.0, 50.0]
  adapter:
    hidden: 64
    steps: 800
    batch_size: 32
    lr: 1.0e-3
    anom_frac: 0.5
    clf_hidden: 32
    clf_steps: 400
    lambda_shell: 0.15
    lambda_cls: 0.8
    rare_hard_neg: true

s0_dir: results/shell_s0
s1_dir: results/shell_s1
s2_dir: results/shell_s2
s3_dir: results/shell_s3
s4_dir: results/shell_s4
s5_dir: results/shell_s5
tune_dir: results/shell_tune
enc_dir: results/shell_enc
plots_dir: results/shell_plots
kindproto_dir: results/shell_kindproto
kindmix_dir: results/shell_kindmix
kindmix_score_dir: results/shell_kindmix_score_esa
kindmix_score_hybrid_dir: results/shell_kindmix_score_hybrid
kindmix_htune_dir: results/shell_kindmix_htune
noise_score_dir: results/shell_noise_score
enc_score_dir: results/shell_enc_score
