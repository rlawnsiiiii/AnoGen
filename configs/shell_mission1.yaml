# Steered diffusion + GenIAS and post-hoc references. No SCM or PCMCI+.
phase: s0
seed: 0
output_dir: results/shell_s0
allow_test_telemetry: false

causaldiscovery_root: /mnt/extras/SSD/AI/CausalDiscovery
panel_npz: results/mission1/panel_light.npz
data_root: data/ESA-Mission1
bin_seconds: 30

splits:
  path_train_end: "2006-10-01"
  official_train_end: "2007-01-01"

channels:
  - channel_41
  - channel_42
  - channel_43
  - channel_44
  - channel_45
  - channel_46

shell:
  W: 512
  N_generate: 256
  n_folds: 3
  n_nominal_per_channel: 4096
  max_crops_per_event: 8
  guard_bins: 16
  min_anomaly_windows: 5
  min_fs_windows: 8
  train_includes_rares: true
  rare_upsample: 1
  tau:
    unguided_target: 0.10
  win:
    occupancy_min: 0.8
    diversity_ratio_min: 0.5
    must_beat: [genias, posthoc]
  scaler:
    kind: minmax
    feature_range: [0.0, 1.0]
  diffusion:
    backbone: tsdiff
    hidden: 64
    n_layers: 6
    d_state: 64
    n_times: 200
    steps: 20000
    batch_size: 128
    lr: 2.0e-4
    val_frac: 0.1
    ddim_steps: 20
    unguided_nu: 1.0
    n_sample: 256
  steer:
    enc_hidden: 32
    emb: 32
    enc_steps: 400
    enc_lr: 1.0e-3
    n_ref: 512
    q: 0.99
    delta_scale: 0.25
    nu: 0.2
    lambda: 0.3
    c_max: 1.0
    n_sample: 128
  tune:
    n_cond: 192
    n_ref_label: 256
    bsz: 64
    regen_n: 512
  kindproto:
    n: 128
    ddim_steps_long: 200
  kindmix:
    n: 256
  kindmixscore:
    # false: contiguous donor split, so each targeted kind sees only the one or
    # two channels its block lands on (the frozen hybrid_needles galleries).
    # true: split within every channel instead. scripts/run_chanmix.py sets this
    # and writes results/shell_chanmix/. See docs/CHANMIX.md.
    channel_stratified: false
  kindmix_htune:
    n: 128
  quiettune:
    n: 128
    lam_quiet: [0.0, 0.05, 0.10, 0.15, 0.20]
  genbase:
    cutaddpaste:
      width_frac: [0.08, 0.35]
      trend_scale: 0.5
      jitter_sigma: 0.05
      n_paste: 1
    taxonomy:
      families: [point, contextual, shapelet, seasonal, trend]
      severity: [0.5, 2.0]
  editor:
    n_keep: 3
    patch_tau: 0.2
  timeleash:
    n: 1536
    encoders: [time_both]
    recipes: [l2, gm]
    l2:
      lam_parent: 0.03
      parent_leash: l2
    gm:
      lam_parent: 0.15
      parent_leash: gm
      parent_delta: 0.03
  hashfix:
    n: 1536
    encoders: [time_both]
    ddim_steps: 20
    normalize_grad: false
    apply_final_grad: false
  realism:
    # Freeze before the first full audit run. Raw-window audit only:
    # feature_pack_v1, S3, S4, and tau remain unchanged.
    bins: 50
    max_lag: 64
    median_width: 9
    mad_scale: 4.0
    cusum_min_segment: 8
    n_min: 10
    bootstrap: 1000
    seeds: [0, 1, 2, 3, 4]
    c2st_test_size: 0.3
    c2st_permutations: 200
    methods: [donor, shell, unguided, genias, genias_patched, posthoc, c1, c2, cutaddpaste, taxonomy, editor, timeleash_l2, timeleash_gm, hashfix]
  augdetect:
    n_synth: 256
    steps: 400
    hidden: 32
    batch_size: 32
    lr: 1.0e-3
    seeds: [0, 1, 2, 3, 4]
    target_far: 0.01
    n_boot: 1000
    n_nominal_test: 512
    arms: [real_only, posthoc, taxonomy, cutaddpaste, genias, unguided, genfsdiff_c1, genfsdiff_c3, c1_plus_real, c3_plus_real]
  enc_ablation:
    time_emb: 8
    steps_recon: 800
    steps_supcon: 1200
    batch_size: 64
    per_class: 32
    temperature: 0.1
    n_steer: 192

  genias:
    hidden: 48
    latent: 16
    steps: 15000
    batch_size: 128
    psi: 2.0
    psi_extra: [1.0, 1.5]
    patch_tau: 0.2
  adapter:
    hidden: 64
    steps: 800
    batch_size: 32
    lr: 1.0e-3
    anom_frac: 0.5
    clf_hidden: 32
    clf_steps: 400
    lambda_shell: 0.15
    lambda_cls: 0.8
    rare_hard_neg: true

s0_dir: results/shell_s0
s1_dir: results/shell_s1
s2_dir: results/shell_s2
s3_dir: results/shell_s3
s4_dir: results/shell_s4
s5_dir: results/shell_s5
tune_dir: results/shell_tune
enc_dir: results/shell_enc
plots_dir: results/shell_plots
kindproto_dir: results/shell_kindproto
kindmix_dir: results/shell_kindmix
kindmix_score_dir: results/shell_kindmix_score_esa
kindmix_score_hybrid_dir: results/shell_kindmix_score_hybrid
kindmix_htune_dir: results/shell_kindmix_htune
noise_score_dir: results/shell_noise_score
ablate_lambda_dir: results/shell_ablate_lambda
quiettune_dir: results/shell_quiettune
genbase_dir: results/shell_genbase
augdetect_dir: results/shell_augdetect
editor_dir: results/shell_editor
timeleash_dir: results/shell_timeleash
hashfix_dir: results/shell_hashfix
realism_dir: results/shell_realism
enc_score_dir: results/shell_enc_score
