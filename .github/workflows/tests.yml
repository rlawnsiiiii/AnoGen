name: tests
# CPU-only test run: installs torch from the CPU wheel index and runs pytest.
# Needs no data; phases that need ESA artifacts skip themselves.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" matplotlib
      - name: Test
        run: pytest -q
